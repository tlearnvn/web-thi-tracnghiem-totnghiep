; Cấu hình PHP cho hosting chạy PHP-FPM / CGI (cPanel, DirectAdmin, Plesk...)
; Tăng thời gian chạy để học sinh không bị ngắt giữa chừng khi nộp bài / nhập dữ liệu lớn.
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_input_vars = 5000
session.gc_maxlifetime = 43200
display_errors = Off
date.timezone = "Asia/Ho_Chi_Minh"
